name: Copy image to aliyun

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner label to run on"
        required: false
        type: string
        default: cos-m
      project:
        description: 'the name of project to be built and the corresponding image'
        required: true
        type: string
      tag:
        description: 'the image tag'
        required: true
        type: string

env:
  VOLCENGINE: coscene-cn-shanghai.cr.volces.com/coscene
  ALICLOUD: registry.cn-hangzhou.aliyuncs.com/coscene

jobs:
  cp-image-use-gh:
    runs-on: ${{ inputs.runner }}
    # Both registries sit in China and a cos-m guest reaches them over its CN
    # egress line, which uploads at ~2.4 MB/s; a large image takes minutes.
    timeout-minutes: 15
    continue-on-error: true
    steps:
      # Image bytes ride the lane the guest exports as CI_IMAGE_PROXY (osfiles
      # hosts/_cos-ci/ci-guest.nix), and skopeo reads the proxy env, so this
      # step points it there. Elsewhere the variable is empty and the copy
      # runs as before.
      - name: Route the copy through the image lane
        run: |
          if [ -n "${CI_IMAGE_PROXY:-}" ]; then
            echo "HTTPS_PROXY=${CI_IMAGE_PROXY}" >> "$GITHUB_ENV"
            echo "https_proxy=${CI_IMAGE_PROXY}" >> "$GITHUB_ENV"
          fi
      # skopeo copy refuses to run without a signature policy and a cos-m
      # guest ships none. This is the policy every distro package installs:
      # trust what the registry serves.
      - name: Signature policy for skopeo
        run: |
          d="${XDG_CONFIG_HOME:-$HOME/.config}/containers"
          mkdir -p "$d"
          [ -f "$d/policy.json" ] || echo '{"default":[{"type":"insecureAcceptAnything"}]}' > "$d/policy.json"
      - name: Skopeo Copy
        uses: coscene-io/skopeo-copy-action@v1.0.0
        with:
          src-image: ${{ env.VOLCENGINE }}/${{ inputs.project }}:${{ inputs.tag }}
          dst-image: ${{ env.ALICLOUD }}/${{ inputs.project }}:${{ inputs.tag }}
          src-creds: ${{ secrets.VOLCENGINE_CR_USERNAME  }}:${{ secrets.VOLCENGINE_CR_PASSWORD }}
          dst-creds: ${{ secrets.ACR_USERNAME }}:${{ secrets.ACR_PASSWORD }}
