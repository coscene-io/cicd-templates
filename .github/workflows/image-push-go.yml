name: Common Go deploy

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner label to run on"
        required: false
        type: string
        default: cos-m
      project:
        description: 'the name of project to be built and the corresponding image'
        required: true
        type: string
      workspace:
        description: go module workspace
        required: false
        type: string
        default: '.'
      volcengine:
        description: whether push image to volcengine container registry
        required: false
        type: boolean
        default: false
      tag:
        description: image tag to build and push
        required: false
        type: string
        default: latest

    outputs:
      tag:
        value: ${{ jobs.build.outputs.tag }}

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    outputs:
      tag: ${{ steps.build-and-push.outputs.TAG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up go
        uses: actions/setup-go@v4
        with:
          go-version: ">=1.20.2"
      - name: Set up CD tools
        uses: coscene-io/setup-cd-tools@v2.1.1
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: "true"
        with:
          skaffold: '2.3.1'
      - name: ACR login
        uses: docker/login-action@v4
        with:
          registry: registry.cn-hangzhou.aliyuncs.com/coscene
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Set up buf netrc
        uses: extractions/netrc@v3
        with:
          machine: buf.build
          username: ${{ secrets.BUF_USERNAME }}
          password: ${{ secrets.BUF_TOKEN }}
      - name: Set up github netrc
        uses: extractions/netrc@v3
        with:
          machine: github.com
          username: ${{ secrets.GH_PACKAGES_ORG_USERNAME }}
          password: ${{ secrets.GH_PACKAGES_ORG_TOKEN }}
      # buildkitd (docker-container driver) takes env ONLY from buildx
      # driver-opts; the runner's and dockerd's proxy never reach it, so a CN
      # push from a coScene CI guest went direct until this step. The guests
      # export CI_IMAGE_PROXY (the lane image traffic rides); elsewhere it is
      # empty and buildkitd runs without a proxy, as before. The NO_PROXY
      # value carries commas, so buildx needs it quoted whole.
      - name: Surface image-proxy env for buildkitd
        run: |
          echo "IMAGE_PROXY=${CI_IMAGE_PROXY:-}" >> "$GITHUB_ENV"
          echo "IMAGE_NO_PROXY=${NO_PROXY:-}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            env.HTTP_PROXY=${{ env.IMAGE_PROXY }}
            env.HTTPS_PROXY=${{ env.IMAGE_PROXY }}
            "env.NO_PROXY=${{ env.IMAGE_NO_PROXY }},azurecr.io,docker.io,ghcr.io"
      - name: Docker build & push
        id: build-and-push
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          cd ${{ inputs.workspace }}
          skaffold build --build-concurrency=0 -t "$IMAGE_TAG"
          if [[ ${{ github.event_name }} == 'release' || ${{ github.event_name }} == 'prerelease' ]]; then
            result=$(skaffold build --build-concurrency=0 -q | jq '.builds[0].tag')
            echo $result
            withoutRegistry=${result#*:}
            echo $withoutRegistry
            withoutDigest=${withoutRegistry%@*}
            echo $withoutDigest
            echo "TAG=${withoutDigest}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          fi

  cp-image-to-volcengine:
    needs:
      - build
    uses: coscene-io/cicd-templates/.github/workflows/cp-image-to-volcengine.yml@main
    with:
      project: ${{ inputs.project }}
      tag: ${{ needs.build.outputs.tag }}
    secrets: inherit

  callout:
    needs:
      - build
    uses: coscene-io/cicd-templates/.github/workflows/image-callout.yml@main
    with:
      project: ${{ inputs.project }}
      tag: ${{ needs.build.outputs.tag }}
    secrets: inherit
