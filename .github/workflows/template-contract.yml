name: Template contract
on:
  pull_request:
    paths:
      - '.github/workflows/image-push-go.yml'
      - '.github/workflows/cp-image-to-volcengine.yml'
      - '.github/workflows/template-contract.yml'
      - 'tests/test_*.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/image-push-go.yml'
      - '.github/workflows/cp-image-to-volcengine.yml'
      - '.github/workflows/template-contract.yml'
      - 'tests/test_*.py'
jobs:
  skaffold-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s tests -v
