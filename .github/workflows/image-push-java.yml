name: Push image build by Java

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner label to run on"
        required: false
        type: string
        default: cos-m
      project:
        description: 'the name of project to be built and the corresponding image'
        required: true
        type: string

    outputs:
      tag:
        value: ${{ jobs.build.outputs.tag }}

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    outputs:
      tag: ${{ steps.build-and-push.outputs.TAG }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'
      - name: Gradle build
        uses: gradle/gradle-build-action@v2
        env:
          REPOSITORY_USERNAME: ${{ secrets.GH_PACKAGES_ORG_USERNAME }}
          REPOSITORY_TOKEN: ${{ secrets.GH_PACKAGES_ORG_TOKEN }}
        with:
          arguments: build -x test -x check
      - name: ACR login
        uses: docker/login-action@v4
        with:
          registry: registry.cn-hangzhou.aliyuncs.com/coscene
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: coscene-io/setup-cd-tools@v2.1.1
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: "true"
        with:
          skaffold: '2.3.1'
      # buildkitd (docker-container driver) takes env ONLY from buildx
      # driver-opts; the runner's and dockerd's proxy never reach it, so a CN
      # push from a coScene CI guest went direct until this step. Mirrors the
      # recipe proven in coscene-io/runner-smoke image-push-e2e-probe.yml
      # (cn-via-proxy, f6f2090): surface the guest's own proxy env into
      # GITHUB_ENV (the env context does not see the ambient runner env) and
      # hand it to buildkitd as env.* driver-opts. A guest without proxy env
      # runs buildkitd without a proxy, as before. The NO_PROXY value carries
      # commas, so buildx needs it quoted whole.
      - name: Surface guest proxy env
        run: |
          echo "GUEST_HTTP_PROXY=${HTTP_PROXY:-}" >> "$GITHUB_ENV"
          echo "GUEST_HTTPS_PROXY=${HTTPS_PROXY:-}" >> "$GITHUB_ENV"
          echo "GUEST_NO_PROXY=${NO_PROXY:-}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            env.HTTP_PROXY=${{ env.GUEST_HTTP_PROXY }}
            env.HTTPS_PROXY=${{ env.GUEST_HTTPS_PROXY }}
            "env.NO_PROXY=${{ env.GUEST_NO_PROXY }},azurecr.io,docker.io,ghcr.io"
      - name: Build and push images
        id: build-and-push
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
        run: |
          skaffold build --build-concurrency=0 -t latest
          if [[ ${{ github.event_name }} == 'release' || ${{ github.event_name }} == 'prerelease' ]]; then
            result=$(skaffold build --build-concurrency=0 -q | jq '.builds[0].tag')
            echo $result
            withoutRegistry=${result#*:}
            echo $withoutRegistry
            withoutDigest=${withoutRegistry%@*}
            echo $withoutDigest
            echo "TAG=${withoutDigest}" >> $GITHUB_OUTPUT
          else
            echo "TAG=latest" >> $GITHUB_OUTPUT
          fi

  cp-image-to-volcengine:
    needs:
      - build
    uses: coscene-io/cicd-templates/.github/workflows/cp-image-to-volcengine.yml@main
    with:
      project: ${{ inputs.project }}
      tag: ${{ needs.build.outputs.tag }}
    secrets: inherit

  callout:
    needs:
      - build
    uses: coscene-io/cicd-templates/.github/workflows/image-callout.yml@main
    with:
      project: ${{ inputs.project }}
      tag: ${{ needs.build.outputs.tag }}
    secrets: inherit
