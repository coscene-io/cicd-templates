name: Push image build by pnpm

on:
  workflow_call:
    inputs:
      project:
        description: "the name of project to be built and the corresponding image"
        required: true
        type: string
      profile:
        description: "the name of skaffold profile"
        required: false
        type: string
      build:
        description: "the pnpm script name to build the project"
        required: false
        type: string
      pnpm_version:
        description: "the pnpm version to install"
        required: false
        type: string
        default: ""
      runner:
        description: "the runner to use, e.g. ubuntu-latest or 4c-16g"
        required: false
        type: string
        default: ubuntu-latest

    outputs:
      tag:
        value: ${{ jobs.build.outputs.tag }}

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    env:
      BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
      BUF_BUILD_TOKEN: ${{ secrets.BUF_BUILD_TOKEN }}
      GH_PACKAGES_ORG_TOKEN: ${{ secrets.GH_PACKAGES_ORG_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      NODE_OPTIONS: --max_old_space_size=16384
    outputs:
      tag: ${{ steps.build-and-push.outputs.TAG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm from packageManager
        if: ${{ inputs.build != '' && inputs.pnpm_version == '' }}
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Setup pnpm from workflow input
        if: ${{ inputs.build != '' && inputs.pnpm_version != '' }}
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm_version }}
          run_install: false
      - name: Setup Node env
        if: ${{ inputs.build != '' }}
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install Dependencies
        if: ${{ inputs.build != '' }}
        run: pnpm install --frozen-lockfile
      - name: Build
        if: ${{ inputs.build != '' }}
        run: pnpm run ${{ inputs.build }}
      - name: Set up CD tools
        uses: coscene-io/setup-cd-tools@v2.1.1
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: "true"
        with:
          skaffold: "2.3.1"
      - name: ACR login
        uses: docker/login-action@v4
        with:
          registry: registry.cn-hangzhou.aliyuncs.com/coscene
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Set up github netrc
        uses: extractions/netrc@v3
        with:
          machine: github.com
          username: ${{ secrets.GH_PACKAGES_ORG_USERNAME }}
          password: ${{ secrets.GH_PACKAGES_ORG_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Docker build & push
        id: build-and-push
        env:
          IS_RELEASE: ${{ github.event_name == 'release' }}
          SKAFFOLD_PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail

          profile_args=()
          if [[ -n "$SKAFFOLD_PROFILE" ]]; then
            profile_args=(-p "$SKAFFOLD_PROFILE")
          fi

          tag=latest
          if [[ "$IS_RELEASE" == 'true' ]]; then
            image_ref="$(skaffold build --build-concurrency=0 "${profile_args[@]}" --dry-run -q \
              | jq -er '.builds[0].tag')"
            repository="${image_ref%:*}"
            tag="${image_ref##*:}"
            tag="${tag%@*}"

            COSCENE_IMAGE_TAG="$tag" skaffold build \
              --build-concurrency=0 "${profile_args[@]}" -q
            docker buildx imagetools create \
              --tag "$repository:latest" \
              "$repository:$tag"
          else
            COSCENE_IMAGE_TAG="$tag" skaffold build \
              --build-concurrency=0 "${profile_args[@]}" -t latest -q
          fi
          echo "TAG=$tag" >> "$GITHUB_OUTPUT"

  cp-image-to-volcengine:
    needs:
      - build
    uses: coscene-io/cicd-templates/.github/workflows/cp-image-to-volcengine.yml@6e09c726e1f720da6f0d9795f99873ad040368f0
    with:
      project: ${{ inputs.project }}
      tag: ${{ needs.build.outputs.tag }}
    secrets: inherit

  callout:
    needs:
      - build
    uses: coscene-io/cicd-templates/.github/workflows/image-callout.yml@6e09c726e1f720da6f0d9795f99873ad040368f0
    with:
      project: ${{ inputs.project }}
      tag: ${{ needs.build.outputs.tag }}
    secrets: inherit
