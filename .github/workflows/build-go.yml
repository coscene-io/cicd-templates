name: Go build

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner label to run on"
        required: false
        type: string
        default: gcp
      workspace:
        description: go module workspace
        required: false
        type: string
        default: '.'
      go_version:
        description: Go version for actions/setup-go (e.g. 1.23.x, 1.26.0, stable)
        required: false
        type: string
        default: '1.26.x'
      run_tests:
        description: Whether to run `go test` step
        required: false
        type: boolean
        default: true
      isolated_module_cache:
        description: Use a workspace-local Go module cache
        required: false
        type: boolean
        default: false
      download_modules:
        description: Download standalone module dependencies before linting
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Configure isolated Go module cache
        if: ${{ inputs.isolated_module_cache }}
        run: echo "GOMODCACHE=${GITHUB_WORKSPACE}/.cache/go-mod" >> "${GITHUB_ENV}"
      - name: Cache Go modules and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ${{ inputs.isolated_module_cache && format('{0}/.cache/go-mod', github.workspace) || '~/go/pkg/mod' }}
          key: ${{ inputs.isolated_module_cache && format('go-{0}-{1}-{2}-{3}', runner.os, inputs.go_version, inputs.workspace, hashFiles(format('{0}/go.sum', inputs.workspace))) || format('go-{0}-{1}-{2}', runner.os, inputs.go_version, hashFiles(format('{0}/go.sum', inputs.workspace))) }}
          restore-keys: ${{ inputs.isolated_module_cache && format('go-{0}-{1}-{2}-', runner.os, inputs.go_version, inputs.workspace) || format('go-{0}-{1}-', runner.os, inputs.go_version) }}
      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go_version }}
          check-latest: true
          cache: false
      - name: Set up netrc
        uses: extractions/netrc@v3
        with:
          machine: buf.build
          username: ${{ secrets.BUF_USERNAME }}
          password: ${{ secrets.BUF_TOKEN }}
      - name: Set up github netrc
        uses: extractions/netrc@v3
        with:
          machine: github.com
          username: ${{ secrets.GH_PACKAGES_ORG_USERNAME }}
          password: ${{ secrets.GH_PACKAGES_ORG_TOKEN }}
      - name: Download Go modules
        if: ${{ inputs.download_modules }}
        working-directory: ${{ inputs.workspace }}
        env:
          GOWORK: "off"
        run: go mod download
      - name: Go lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: "v2.11"
          working-directory: ${{ inputs.workspace }}
          args: --timeout 15m --concurrency=4
          skip-cache: false
          cache-invalidation-interval: 14
      - name: Go build
        run: go build -v ./${{ inputs.workspace }}/...
      - name: Go test
        if: ${{ inputs.run_tests }}
        run: go test -v ./${{ inputs.workspace }}/...
